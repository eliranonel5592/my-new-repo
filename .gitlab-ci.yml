image: python:3.11

stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

before_script:
  - pip install --upgrade pip
  - pip install -r requirements.txt

build-job:
  stage: build
  script:
    - python -m py_compile my_app.py

test-job:
  stage: test
  script:
    - pytest
